<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI侦探课堂</title>
  <link rel="stylesheet" href="/css/common.css" />
</head>
<body>
  <div class="hero">
    <h1>🔍 AI侦探课堂</h1>
    <p class="muted">INT6066 小组项目 MVP · 单轮投票 · Mock 问询 · 物理/化学双案件</p>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>教师控制台</h2>
      <p class="muted">创建课堂、选择案件、开启/关闭投票、揭晓结果、导出学习记录。</p>
      <a class="btn" href="/teacher.html">进入教师端</a>
    </div>
    <div class="card">
      <h2>学生 / 小组</h2>
      <p class="muted">用课堂码与小组 ID 加入，共同操控侦探角色完成调查与最终指认。</p>
      <a class="btn" href="/student.html">进入学生端</a>
    </div>
  </div>
  <p class="muted" style="text-align:center;margin-top:2rem;font-size:0.85rem;">
    演示问答（Mock）无需 API Key · 教师答案保存在服务端 · 不提供多轮投票/排除/补发线索
  </p>
</body>
</html>
