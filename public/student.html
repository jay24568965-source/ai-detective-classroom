<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>学生端 · AI侦探课堂</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body>
  <div id="join" class="card" style="margin-top:2rem;">
    <h1>加入课堂</h1>
    <label>课堂码</label>
    <input id="code" placeholder="例如 A1B2C3" autocomplete="off" />
    <label>小组 ID（不可猜测占用；首次自定，如 G1）</label>
    <input id="groupId" placeholder="G1" />
    <label>小组显示名</label>
    <input id="groupLabel" placeholder="第一组" />
    <div class="row" style="margin-top:1rem;">
      <button id="btnJoin">加入</button>
      <button class="secondary" id="btnRejoin">用本机令牌重连</button>
      <a class="btn secondary" href="/">首页</a>
    </div>
    <div id="joinMsg" class="flash" style="display:none;"></div>
  </div>

  <div id="gameUI" class="game-shell" style="display:none;">
    <div class="topbar">
      <strong id="caseName"></strong>
      <span class="badge" id="roomBadge"></span>
      <span class="badge" id="groupBadge"></span>
      <span class="badge mock" id="aiBadge">演示问答（Mock）</span>
      <span class="task muted" id="taskBar">目标：探索场景、收集证据、问询人物</span>
      <button class="secondary" id="btnEvidence">证据板</button>
      <button class="secondary" id="btnNotes">笔记</button>
      <button class="secondary" id="btnCalc">科学分析</button>
    </div>
    <div class="stage-wrap">
      <canvas id="gameCanvas" width="800" height="540"></canvas>
      <div class="prompt-chip" id="promptChip"></div>
      <div class="touch-pad" id="touchPad">
        <button class="up" data-dx="0" data-dy="-1">↑</button>
        <button class="left" data-dx="-1" data-dy="0">←</button>
        <button class="interact" id="btnTouchE">E</button>
        <button class="right" data-dx="1" data-dy="0">→</button>
        <button class="down" data-dx="0" data-dy="1">↓</button>
      </div>
    </div>
    <aside class="side">
      <h3>证据板 <span id="evCount" class="badge">0</span></h3>
      <div class="list" id="evList"></div>
      <h3>已问询</h3>
      <div class="list" id="ivList"></div>
      <h3>教师提示</h3>
      <div class="list" id="hintList"></div>
      <p class="muted" style="font-size:0.75rem;margin-top:1rem;">WASD / 方向键移动 · E 互动 · 打开面板时停止移动</p>
    </aside>
  </div>

  <!-- Modals -->
  <div class="overlay" id="modalBrief">
    <div class="modal">
      <h2>案件简报</h2>
      <p id="briefBg"></p>
      <ul id="briefList"></ul>
      <button id="btnBriefOk">开始调查</button>
    </div>
  </div>

  <div class="overlay" id="modalDialog">
    <div class="modal">
      <h2 id="dialogTitle">交谈</h2>
      <span class="badge mock">演示问答（Mock）</span>
      <div class="chat-log" id="chatLog"></div>
      <div class="preset-btns" id="presetBtns"></div>
      <label>或输入问题（将匹配预设）</label>
      <input id="customQ" />
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnAsk">提问</button>
        <button class="secondary" id="btnCloseDialog">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalItem">
    <div class="modal">
      <h2 id="itemTitle">调查</h2>
      <div id="itemBody"></div>
      <button id="btnCloseItem" style="margin-top:0.75rem;">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalEvidence">
    <div class="modal wide">
      <h2>证据板</h2>
      <div id="evidenceDetail"></div>
      <button class="secondary" id="btnCloseEv">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalNotes">
    <div class="modal">
      <h2>推理笔记</h2>
      <textarea id="notesArea" rows="10" placeholder="记录证据链与讨论要点…"></textarea>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSaveNotes">保存</button>
        <button class="secondary" id="btnCloseNotes">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalCalc">
    <div class="modal wide">
      <h2>科学分析 / 计算草稿</h2>
      <div id="calcBody"></div>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSaveCalc">保存草稿</button>
        <button class="secondary" id="btnCloseCalc">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalVote">
    <div class="modal">
      <h2>最终投票（仅一次）</h2>
      <p id="voteQuestion" class="muted"></p>
      <label>选择人物</label>
      <select id="voteSuspect"></select>
      <label>引用的证据编号</label>
      <input id="voteEvidence" placeholder="例如 E01,E04,E08 或计算结论" />
      <label>科学分析依据</label>
      <textarea id="voteRationale" rows="5" placeholder="说明为何该陈述/行为与证据矛盾或构成直接致因…"></textarea>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSubmitVote" class="ok">确认提交（不可改）</button>
        <button class="secondary" id="btnCloseVoteModal">取消</button>
      </div>
      <p class="muted" style="font-size:0.8rem;">提交前请小组检查。确认后锁定，不得改选。</p>
    </div>
  </div>

  <div class="overlay" id="modalResult">
    <div class="modal">
      <h2>揭晓结果</h2>
      <p id="resultStatus" style="font-size:1.25rem;"></p>
      <div id="resultSummary"></div>
      <button id="btnCloseResult">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalHost">
    <div class="modal">
      <h2>调查主持人</h2>
      <p id="hostText"></p>
      <div class="row">
        <button id="btnHostVote" style="display:none;">进入最终投票</button>
        <button class="secondary" id="btnCloseHost">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ai-adapter.js"></script>
  <script src="/js/game-engine.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
