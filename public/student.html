<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title data-i18n="student.docTitle">学生端 · AI侦探课堂</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body>
  <div class="lang-switch" id="langSwitch" role="group" aria-label="语言">
    <button type="button" data-set-lang="zh" aria-pressed="true">简体</button>
    <span class="lang-sep" aria-hidden="true">|</span>
    <button type="button" data-set-lang="zh-TW" aria-pressed="false">繁體</button>
    <span class="lang-sep" aria-hidden="true">|</span>
    <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
  </div>
  <div id="join" class="card" style="margin-top:2rem;">
    <h1 data-i18n="student.heading">加入课堂</h1>
    <label data-i18n="student.code">课堂码</label>
    <input id="code" data-i18n-placeholder="student.codePh" placeholder="例如 A1B2C3" autocomplete="off" />
    <label data-i18n="student.groupId">小组 ID（不可猜测占用；首次自定，如 G1）</label>
    <input id="groupId" placeholder="G1" />
    <label data-i18n="student.groupLabel">小组显示名</label>
    <input id="groupLabel" data-i18n-placeholder="student.groupPh" placeholder="第一组" />
    <div class="row" style="margin-top:1rem;">
      <button id="btnJoin" data-i18n="student.join">加入</button>
      <button class="secondary" id="btnRejoin" data-i18n="student.rejoin">用本机令牌重连</button>
      <a class="btn secondary" href="/" data-i18n="student.home">首页</a>
    </div>
    <div id="joinMsg" class="flash" style="display:none;"></div>
  </div>

  <div id="gameUI" class="game-shell" style="display:none;">
    <div class="topbar">
      <strong id="caseName"></strong>
      <span class="badge" id="roomBadge"></span>
      <span class="badge" id="groupBadge"></span>
      <span class="badge mock" id="aiBadge">演示问答（Mock）</span>
      <span class="task muted" id="taskBar">目标：探索场景、收集证据、问询人物</span>
      <button class="secondary" id="btnEvidence" data-i18n="student.evidenceBtn">证据板</button>
      <button class="secondary" id="btnNotes" data-i18n="student.notesBtn">笔记</button>
      <button class="secondary" id="btnCalc" data-i18n="student.calcBtn">科学分析</button>
    </div>
    <div class="stage-wrap">
      <canvas id="gameCanvas" width="800" height="540"></canvas>
      <div class="prompt-chip" id="promptChip"></div>
    </div>
    <aside class="side">
      <h3><span data-i18n="student.evidenceTitle">证据板</span> <span id="evCount" class="badge">0</span></h3>
      <div class="list" id="evList"></div>
      <h3 data-i18n="student.interviewed">已问询</h3>
      <div class="list" id="ivList"></div>
      <h3 data-i18n="student.hints">教师提示</h3>
      <div class="list" id="hintList"></div>
      <p class="muted" data-i18n="student.help" style="font-size:0.75rem;margin-top:1rem;">点击地面移动 · 点击线索、人物或门互动 · 打开面板时暂停移动</p>
    </aside>
  </div>

  <!-- Modals -->
  <div class="overlay" id="modalBrief">
    <div class="modal">
      <h2 data-i18n="brief.title">案件简报</h2>
      <p id="briefBg"></p>
      <ul id="briefList"></ul>
      <button id="btnBriefOk" data-i18n="brief.start">开始调查</button>
    </div>
  </div>

  <div class="overlay" id="modalDialog">
    <div class="modal">
      <h2 id="dialogTitle" data-i18n="dialog.title">交谈</h2>
      <span class="badge mock" id="dialogAiBadge">演示问答（Mock）</span>
      <div class="chat-log" id="chatLog"></div>
      <div class="preset-btns" id="presetBtns"></div>
      <label data-i18n="dialog.orType">或输入问题（预设或自由提问）</label>
      <input id="customQ" />
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnAsk" data-i18n="dialog.ask">提问</button>
        <button class="secondary" id="btnCloseDialog" data-i18n="dialog.close">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalItem">
    <div class="modal">
      <h2 id="itemTitle" data-i18n="item.title">调查</h2>
      <div id="itemBody"></div>
      <button id="btnCloseItem" data-i18n="item.close" style="margin-top:0.75rem;">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalEvidence">
    <div class="modal wide">
      <h2 data-i18n="evidence.title">证据板</h2>
      <div id="evidenceDetail"></div>
      <button class="secondary" id="btnCloseEv" data-i18n="evidence.close">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalNotes">
    <div class="modal">
      <h2 data-i18n="notes.title">推理笔记</h2>
      <textarea id="notesArea" rows="10" data-i18n-placeholder="notes.ph" placeholder="记录证据链与讨论要点…"></textarea>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSaveNotes" data-i18n="notes.save">保存</button>
        <button class="secondary" id="btnCloseNotes" data-i18n="notes.close">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalCalc">
    <div class="modal wide">
      <h2 data-i18n="calc.title">科学分析 / 计算草稿</h2>
      <div id="calcBody"></div>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSaveCalc" data-i18n="calc.save">保存草稿</button>
        <button class="secondary" id="btnCloseCalc" data-i18n="calc.close">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modalVote">
    <div class="modal">
      <h2 data-i18n="vote.title">最终投票（仅一次）</h2>
      <p id="voteQuestion" class="muted"></p>
      <label data-i18n="vote.who">选择人物</label>
      <select id="voteSuspect"></select>
      <label data-i18n="vote.evidence">引用的证据编号</label>
      <input id="voteEvidence" data-i18n-placeholder="vote.evidencePh" placeholder="例如 E01,E04,E08 或计算结论" />
      <label data-i18n="vote.why">科学分析依据</label>
      <textarea id="voteRationale" rows="5" data-i18n-placeholder="vote.whyPh" placeholder="说明为何该陈述/行为与证据矛盾或构成直接致因…"></textarea>
      <div class="row" style="margin-top:0.75rem;">
        <button id="btnSubmitVote" class="ok" data-i18n="vote.submit">确认提交（不可改）</button>
        <button class="secondary" id="btnCloseVoteModal" data-i18n="vote.cancel">取消</button>
      </div>
      <p class="muted" data-i18n="vote.note" style="font-size:0.8rem;">提交前请小组检查。确认后锁定，不得改选。</p>
    </div>
  </div>

  <div class="overlay" id="modalResult">
    <div class="modal">
      <h2 data-i18n="result.title">揭晓结果</h2>
      <p id="resultStatus" style="font-size:1.25rem;"></p>
      <div id="resultSummary"></div>
      <button id="btnCloseResult" data-i18n="result.close">关闭</button>
    </div>
  </div>

  <div class="overlay" id="modalHost">
    <div class="modal">
      <h2 data-i18n="host.title">调查主持人</h2>
      <p id="hostText"></p>
      <div class="row">
        <button id="btnHostVote" style="display:none;">进入最终投票</button>
        <button class="secondary" id="btnCloseHost" data-i18n="host.close">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/case-locale.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ai-adapter.js"></script>
  <script src="/js/game-engine.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
